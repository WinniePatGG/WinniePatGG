name: Update Profile Graphs

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > query.json <<'EOF'
          {
            "query": "query($login:String!) { user(login:$login) { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount contributionLevel color } } } } } }",
            "variables": {
              "login": "WinniePatGG"
            }
          }
          EOF

          curl -sS \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            --data @query.json \
            > contributions.json

      - name: Generate SVG graphs
        run: |
          mkdir -p assets

          python3 <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          with open("contributions.json", "r") as f:
              data = json.load(f)

          if "errors" in data:
              print(json.dumps(data["errors"], indent=2))
              raise SystemExit("GitHub GraphQL request failed.")

          calendar = (
              data["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          weeks = calendar["weeks"]
          total = calendar["totalContributions"]

          # ==========================================================
          # CONTRIBUTION GRAPH
          # ==========================================================

          width = 900
          height = 190

          left = 42
          top = 45

          cell = 11
          gap = 3

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'viewBox="0 0 {width} {height}" '
              f'width="{width}" height="{height}">',

              '<rect width="100%" height="100%" rx="12" fill="#0d1117"/>',

              '<style>',
              'text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }',
              '</style>',

              f'<text x="{left}" y="25" '
              f'fill="#f0f6fc" font-size="14" font-weight="600">'
              f'{total:,} contributions in the last year'
              f'</text>'
          ]

          # GitHub-style contribution colors
          colors = {
              "NONE": "#161b22",
              "FIRST_QUARTILE": "#0e4429",
              "SECOND_QUARTILE": "#006d32",
              "THIRD_QUARTILE": "#26a641",
              "FOURTH_QUARTILE": "#39d353"
          }

          # Weekday labels
          weekday_labels = {
              0: "Mon",
              2: "Wed",
              4: "Fri"
          }

          for row, label in weekday_labels.items():
              y = top + row * (cell + gap) + 9

              svg.append(
                  f'<text x="5" y="{y}" '
                  f'fill="#8b949e" font-size="9">'
                  f'{label}</text>'
              )

          # Draw contribution cells
          for x, week in enumerate(weeks):

              for day in week["contributionDays"]:

                  # GitHub gives us the date, so calculate weekday ourselves.
                  weekday = date.fromisoformat(
                      day["date"]
                  ).weekday()

                  px = left + x * (cell + gap)
                  py = top + weekday * (cell + gap)

                  level = day["contributionLevel"]

                  color = colors.get(
                      level,
                      day.get("color", "#161b22")
                  )

                  count = day["contributionCount"]

                  svg.append(
                      f'<rect '
                      f'x="{px}" '
                      f'y="{py}" '
                      f'width="{cell}" '
                      f'height="{cell}" '
                      f'rx="2" '
                      f'fill="{color}">'
                      f'<title>'
                      f'{count} contribution'
                      f'{"s" if count != 1 else ""} '
                      f'on {day["date"]}'
                      f'</title>'
                      f'</rect>'
                  )

          svg.append("</svg>")

          Path("assets/contributions.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          # ==========================================================
          # CONTRIBUTION SNAKE
          # ==========================================================

          width = 900
          height = 190

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'viewBox="0 0 {width} {height}" '
              f'width="{width}" height="{height}">',

              '<rect width="100%" height="100%" rx="12" fill="#0d1117"/>',

              '<style>',
              'text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }',
              '</style>',

              '<text x="30" y="30" '
              'fill="#f0f6fc" font-size="14" font-weight="600">'
              'Contribution activity'
              '</text>'
          ]

          # Flatten all days and sort them chronologically
          days = []

          for week in weeks:
              for contribution_day in week["contributionDays"]:
                  days.append(contribution_day)

          days.sort(key=lambda x: x["date"])

          # Map contribution levels to vertical movement
          levels = {
              "NONE": 0,
              "FIRST_QUARTILE": 1,
              "SECOND_QUARTILE": 2,
              "THIRD_QUARTILE": 3,
              "FOURTH_QUARTILE": 4
          }

          points = []

          for i, day in enumerate(days):

              x = 25 + (
                  i / max(1, len(days) - 1)
              ) * 850

              level = levels.get(
                  day["contributionLevel"],
                  0
              )

              y = 110 - level * 15

              points.append((x, y))

          # Background grid
          for x in range(25, 876, 25):
              svg.append(
                  f'<line '
                  f'x1="{x}" y1="55" '
                  f'x2="{x}" y2="165" '
                  f'stroke="#21262d" '
                  f'stroke-width="1" '
                  f'opacity="0.5"/>'
              )

          for y in range(55, 166, 22):
              svg.append(
                  f'<line '
                  f'x1="25" y1="{y}" '
                  f'x2="875" y2="{y}" '
                  f'stroke="#21262d" '
                  f'stroke-width="1" '
                  f'opacity="0.5"/>'
              )

          # Draw snake path
          if points:

              path = " ".join(
                  f"{x:.1f},{y:.1f}"
                  for x, y in points
              )

              svg.append(
                  f'<polyline '
                  f'points="{path}" '
                  f'fill="none" '
                  f'stroke="#39d353" '
                  f'stroke-width="4" '
                  f'stroke-linecap="round" '
                  f'stroke-linejoin="round"/>'
              )

              # Snake head
              x, y = points[-1]

              svg.append(
                  f'<circle '
                  f'cx="{x:.1f}" '
                  f'cy="{y:.1f}" '
                  f'r="8" '
                  f'fill="#39d353"/>'
              )

              # Eyes
              svg.append(
                  f'<circle '
                  f'cx="{x + 3:.1f}" '
                  f'cy="{y - 2:.1f}" '
                  f'r="1.5" '
                  f'fill="#0d1117"/>'
              )

          svg.append("</svg>")

          Path("assets/snake.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print("Generated:")
          print("  assets/contributions.svg")
          print("  assets/snake.svg")
          PY

      - name: Commit generated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg assets/snake.svg

          if git diff --cached --quiet; then
            echo "No graph changes."
          else
            git commit -m "chore: update profile graphs"
            git push
          fi
