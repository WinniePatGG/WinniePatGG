name: Update Profile Graphs

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p generated

          cat > query.json <<'EOF'
          {
            "query": "query($login:String!) { user(login:$login) { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount contributionLevel color } } } } } }",
            "variables": {
              "login": "WinniePatGG"
            }
          }
          EOF

          curl -sS \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            --data @query.json \
            > contributions.json

          python3 <<'PY'
          import json
          import html
          from pathlib import Path

          data = json.load(open("contributions.json"))

          if "errors" in data:
              raise SystemExit(json.dumps(data["errors"], indent=2))

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          weeks = calendar["weeks"]
          total = calendar["totalContributions"]

          # ---------------------------------------------------------
          # Contribution graph
          # ---------------------------------------------------------

          width = 900
          height = 210

          left = 42
          top = 42
          cell = 11
          gap = 3

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'viewBox="0 0 {width} {height}" '
              f'width="{width}" height="{height}">',
              '<rect width="100%" height="100%" rx="12" fill="#0d1117"/>',
              '<style>',
              'text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }',
              '</style>',
              f'<text x="{left}" y="24" fill="#f0f6fc" font-size="14" font-weight="600">'
              f'{total:,} contributions in the last year</text>'
          ]

          # Weekday labels
          labels = [
              (0, "Sun"),
              (2, "Tue"),
              (4, "Thu")
          ]

          for row, label in labels:
              y = top + row * (cell + gap) + 9
              svg.append(
                  f'<text x="5" y="{y}" fill="#8b949e" font-size="9">{label}</text>'
              )

          # GitHub contribution colors
          colors = {
              "NONE": "#161b22",
              "FIRST_QUARTILE": "#0e4429",
              "SECOND_QUARTILE": "#006d32",
              "THIRD_QUARTILE": "#26a641",
              "FOURTH_QUARTILE": "#39d353"
          }

          for x, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  weekday = day["weekday"]

                  px = left + x * (cell + gap)
                  py = top + weekday * (cell + gap)

                  color = colors.get(
                      day["contributionLevel"],
                      day.get("color", "#161b22")
                  )

                  count = day["contributionCount"]
                  date = html.escape(day["date"])

                  svg.append(
                      f'<rect x="{px}" y="{py}" width="{cell}" height="{cell}" '
                      f'rx="2" fill="{color}">'
                      f'<title>{count} contribution{"s" if count != 1 else ""} on {date}</title>'
                      f'</rect>'
                  )

          svg.append('</svg>')

          Path("generated/contributions.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Snake
          # ---------------------------------------------------------

          snake_width = 900
          snake_height = 210

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'viewBox="0 0 {snake_width} {snake_height}" '
              f'width="{snake_width}" height="{snake_height}">',
              '<rect width="100%" height="100%" rx="12" fill="#0d1117"/>',
              '<style>',
              'text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }',
              '</style>',
              f'<text x="30" y="30" fill="#f0f6fc" font-size="14" font-weight="600">'
              'Contribution Snake</text>'
          ]

          # Flatten contribution days
          days = []

          for week in weeks:
              for day in week["contributionDays"]:
                  days.append(day)

          # Sort chronologically
          days.sort(key=lambda x: x["date"])

          # Use the contribution calendar as the snake path.
          #
          # We map the 371-ish days onto a clean horizontal path.
          # Contribution intensity controls the vertical movement.
          points = []

          for i, day in enumerate(days):
              x = 20 + (i / max(1, len(days) - 1)) * 860

              level = {
                  "NONE": 0,
                  "FIRST_QUARTILE": 1,
                  "SECOND_QUARTILE": 2,
                  "THIRD_QUARTILE": 3,
                  "FOURTH_QUARTILE": 4
              }.get(day["contributionLevel"], 0)

              y = 110 - level * 15

              points.append((x, y))

          # Grid-like background
          for x in range(20, 881, 20):
              svg.append(
                  f'<line x1="{x}" y1="55" x2="{x}" y2="165" '
                  'stroke="#21262d" stroke-width="1" opacity="0.45"/>'
              )

          for y in range(55, 166, 22):
              svg.append(
                  f'<line x1="20" y1="{y}" x2="880" y2="{y}" '
                  'stroke="#21262d" stroke-width="1" opacity="0.45"/>'
              )

          if points:
              path = " ".join(
                  f"{x:.1f},{y:.1f}"
                  for x, y in points
              )

              svg.append(
                  f'<polyline points="{path}" '
                  'fill="none" stroke="#39d353" '
                  'stroke-width="3" stroke-linecap="round" '
                  'stroke-linejoin="round"/>'
              )

              # Snake head
              x, y = points[-1]

              svg.append(
                  f'<circle cx="{x:.1f}" cy="{y:.1f}" r="7" '
                  'fill="#39d353"/>'
              )

              svg.append(
                  f'<circle cx="{x + 3:.1f}" cy="{y - 2:.1f}" r="1.5" '
                  'fill="#0d1117"/>'
              )

          svg.append('</svg>')

          Path("generated/snake.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )
          PY

      - name: Commit generated graphs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/WinniePatGG/WinniePatGG.git" repo

          mkdir -p repo/assets

          cp generated/contributions.svg repo/assets/contributions.svg
          cp generated/snake.svg repo/assets/snake.svg

          cd repo

          git add assets/contributions.svg assets/snake.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update profile graphs"
          git push
